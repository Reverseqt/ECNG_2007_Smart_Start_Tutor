<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>P2B Datasheet Viewer Prototype</title>
  <style>
    #viewer-container {
      position: relative;
      display: inline-block;
      border: 1px solid #ccc;
    }
    #pdf-canvas { display: block; }
    .hotspot {
      position: absolute;
      border: 2px solid #007bff;
      background-color: rgba(0, 123, 255, 0.2);
      cursor: pointer;
    }
    .hotspot:hover { background-color: rgba(0, 123, 255, 0.4); }
    .tooltip {
      visibility: hidden;
      position: absolute;
      bottom: 105%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #222;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
    }
    .hotspot:hover .tooltip { visibility: visible; }
  </style>
</head>
<body>
  <h2>P2B Datasheet Explorer Activity</h2>
  <div id="viewer-container">
    <canvas id="pdf-canvas"></canvas>
    <div id="overlay-layer"></div>
  </div>

  <!-- Note type="module" -->
  <script type="module" src="viewer.js"></script>
</body>
</html>
